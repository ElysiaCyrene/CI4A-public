name: ci4a-release
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: shopping_admin
      MYSQL_USER: ci4a
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - ci4a_mysql:/var/lib/mysql
      - type: bind
        source: ./data/private/bootstrap.sql
        target: /docker-entrypoint-initdb.d/01-bootstrap.sql
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  ci4a_mysql:
